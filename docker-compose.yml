version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: parkease_postgres
    restart: always
    environment:
      POSTGRES_USER: parkease
      POSTGRES_PASSWORD: parkease_password_2026
      POSTGRES_DB: parkease_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: parkease_redis
    restart: always
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: parkease_api
    restart: always
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://parkease:parkease_password_2026@postgres:5432/parkease_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=parkease_super_secret_jwt_key_2026_change_in_production
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: parkease_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - api

volumes:
  postgres_data:
